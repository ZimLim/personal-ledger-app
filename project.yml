name: PersonalLedger
options:
  bundleIdPrefix: com.hazim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LedgerCore:
    path: LedgerCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only

targets:
  PersonalLedger:
    type: application
    platform: iOS
    sources:
      - path: PersonalLedger
    dependencies:
      - package: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazim.personalledger
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM left unset — simulator builds need no signing.
        # Set it (or use the Xcode GUI) for physical-device deploys on the free team.

  PersonalLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonalLedgerTests
    dependencies:
      - target: PersonalLedger
      - package: LedgerCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  PersonalLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PersonalLedgerUITests
    dependencies:
      - target: PersonalLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PersonalLedger:
    build:
      targets:
        PersonalLedger: all
    test:
      targets:
        - PersonalLedgerTests
        - PersonalLedgerUITests
